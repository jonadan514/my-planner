<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#166534" />
    <title>Prec · 오프라인</title>
    <style>
      * { box-sizing: border-box; }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 24px;
        background: linear-gradient(180deg, #f7fcf8 0%, #e8f3eb 100%);
        color: #17352b;
        font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }
      main {
        width: min(100%, 360px);
        padding: 28px;
        text-align: center;
        border: 1px solid #d9eadf;
        border-radius: 24px;
        background: rgba(255, 255, 255, 0.9);
        box-shadow: 0 20px 50px rgba(22, 101, 52, 0.1);
      }
      .logo {
        display: grid;
        place-items: center;
        width: 56px;
        height: 56px;
        margin: 0 auto 20px;
        border-radius: 16px;
        background: #16a34a;
        font-size: 20px;
        font-weight: 900;
      }
      h1 { margin: 0; font-size: 22px; }
      p { margin: 12px 0 0; color: #537063; line-height: 1.6; font-size: 14px; }
      button {
        width: 100%;
        margin-top: 24px;
        padding: 13px 16px;
        border: 0;
        border-radius: 16px;
        background: #16a34a;
        color: #fff;
        font: inherit;
        font-weight: 700;
      }
    </style>
  </head>
  <body>
    <main>
      <div class="logo">P</div>
      <h1>인터넷 연결을 확인해 주세요</h1>
      <p>Prec는 연결되면 최신 버전을 자동으로 불러옵니다. 네트워크를 확인한 뒤 다시 시도해 주세요.</p>
      <button type="button" onclick="location.replace('https://my-planner-brown.vercel.app/')">다시 시도</button>
    </main>
  </body>
</html>
