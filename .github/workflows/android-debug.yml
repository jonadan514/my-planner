name: Android debug APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'android/**'
      - 'capacitor.config.ts'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/android-debug.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
          cache: gradle
      - name: Install web dependencies
        run: npm ci
      - name: Sync web app to Android
        run: npm run android:sync
      - name: Prepare stable signing key
        env:
          PREC_KEYSTORE_BASE64: ${{ secrets.PREC_KEYSTORE_BASE64 }}
          PREC_KEYSTORE_PASSWORD: ${{ secrets.PREC_KEYSTORE_PASSWORD }}
        run: |
          test -n "$PREC_KEYSTORE_BASE64"
          test -n "$PREC_KEYSTORE_PASSWORD"
          echo "$PREC_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/prec-signing.p12"
          echo "PREC_KEYSTORE_PATH=$RUNNER_TEMP/prec-signing.p12" >> "$GITHUB_ENV"
          echo "PREC_KEYSTORE_PASSWORD=$PREC_KEYSTORE_PASSWORD" >> "$GITHUB_ENV"
      - name: Make Gradle wrapper executable
        run: chmod +x android/gradlew
      - name: Build debug APK
        working-directory: android
        run: ./gradlew assembleDebug
      - name: Name APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk Prec-1.1.1.apk
      - uses: actions/upload-artifact@v4
        with:
          name: prec-debug-apk
          path: Prec-1.1.1.apk
          if-no-files-found: error
